# Council Roster Configuration
# Defines roles, model assignments, and preset configurations for the council system

roles:
  analyst:
    description: "Analyzes information critically, identifies patterns and inconsistencies"
    model_id: "openrouter/anthropic/claude-opus-4.6"
    timeout_s: 120
    seat: 1

  strategist:
    description: "Plans long-term approaches, considers strategic implications"
    model_id: "openrouter/openai/gpt-5.4"
    timeout_s: 90
    seat: 2

  skeptic:
    description: "Questions assumptions, challenges conventional wisdom"
    model_id: "openrouter/moonshotai/kimi-k2.5"
    timeout_s: 120
    seat: 3

  contrarian:
    description: "Takes opposing views, forces reconsideration of positions"
    model_id: "openrouter/x-ai/grok-4"
    timeout_s: 90
    seat: 4

  auditor:
    description: "Reviews decisions for errors, validates reasoning chains"
    model_id: "openrouter/deepseek/deepseek-r1"
    timeout_s: 120
    seat: 5

presets:
  # Default: All 5 seats active, audit mode off
  # Balanced approach with full council participation
  default:
    active_seats:
      - analyst
      - strategist
      - skeptic
      - contrarian
      - auditor
    audit_mode: false
    description: "Full council with all 5 seats active"

  # Adversarial: Contrarian gets special ROUND_2_CONTRARIAN prompt
  # Designed to stress-test arguments with maximum opposition
  adversarial:
    active_seats:
      - analyst
      - strategist
      - skeptic
      - contrarian
      - auditor
    audit_mode: false
    contrarian_prompt: "ROUND_2_CONTRARIAN"
    description: "Full council with contrarian in adversarial mode"

  # Lean: Only 3 seats (analyst, skeptic, contrarian)
  # Optimized for speed and cost - skips strategist and auditor
  lean:
    active_seats:
      - analyst
      - skeptic
      - contrarian
    audit_mode: false
    description: "Minimal 3-seat configuration for faster/cheaper execution"
