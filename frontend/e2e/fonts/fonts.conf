<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- No system includes: the checked-in faces are the entire fixture font set. -->
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Chromium resolves its system UI face through the default sans family. -->
  <alias>
    <family>sans</family>
    <prefer><family>Noto Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Noto Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
  <!-- Match the reference rasterization, not the distro's fontconfig defaults. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
