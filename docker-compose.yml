services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://daemon:daemon@postgres:5432/daemon}
    volumes:
      - .:/app
    command: python scripts/migrate.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - daemon-network
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - FAL_KEY=${FAL_KEY}
      - MOCK_LLM=${MOCK_LLM:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://daemon:daemon@postgres:5432/daemon}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DAEMON_ENCRYPTION_KEY=${DAEMON_ENCRYPTION_KEY}
      - DAEMON_ENVIRONMENT=${DAEMON_ENVIRONMENT:-development}
      - DAEMON_AUTH_PEPPER=${DAEMON_AUTH_PEPPER}
      - DAEMON_ALLOWED_ORIGINS=${DAEMON_ALLOWED_ORIGINS:-http://localhost:3000}
      - DAEMON_ALLOWED_HOSTS=${DAEMON_ALLOWED_HOSTS:-}
      - DAEMON_PUBLIC_ORIGIN=${DAEMON_PUBLIC_ORIGIN:-http://localhost:3000}
      - DAEMON_COOKIE_SECURE=${DAEMON_COOKIE_SECURE:-false}
      - DAEMON_ADMIN_API_KEY=${DAEMON_ADMIN_API_KEY}
      - DAEMON_HOSTED_IDENTITY_ENABLED=${DAEMON_HOSTED_IDENTITY_ENABLED:-false}
      - DAEMON_DEPLOYMENT_MODE=${DAEMON_DEPLOYMENT_MODE:-self_hosted}
      - DAEMON_SIGNUP_MODE=${DAEMON_SIGNUP_MODE:-invite_only}
      - DAEMON_GOOGLE_ENABLED=${DAEMON_GOOGLE_ENABLED:-true}
      - DAEMON_GOOGLE_CLIENT_ID=${DAEMON_GOOGLE_CLIENT_ID:-}
      - DAEMON_GOOGLE_AUDIENCE_ALLOWLIST=${DAEMON_GOOGLE_AUDIENCE_ALLOWLIST:-}
      - DAEMON_EMAIL_ENABLED=${DAEMON_EMAIL_ENABLED:-true}
      - DAEMON_EMAIL_CHALLENGE_TTL_SECONDS=${DAEMON_EMAIL_CHALLENGE_TTL_SECONDS:-600}
      - DAEMON_EMAIL_CHALLENGE_MAX_ATTEMPTS=${DAEMON_EMAIL_CHALLENGE_MAX_ATTEMPTS:-5}
      - DAEMON_GOOGLE_NONCE_TTL_SECONDS=${DAEMON_GOOGLE_NONCE_TTL_SECONDS:-600}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_HOUR=${DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_HOUR:-3}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_DAY=${DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_DAY:-10}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_HOUR=${DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_HOUR:-5}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_DAY=${DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_DAY:-20}
      - DAEMON_RATE_LIMIT_EMAIL_COMPLETE_PER_IP_PER_HOUR=${DAEMON_RATE_LIMIT_EMAIL_COMPLETE_PER_IP_PER_HOUR:-20}
      - DAEMON_PRIVATE_REFRESH_TTL_DAYS=${DAEMON_PRIVATE_REFRESH_TTL_DAYS:-90}
      - DAEMON_TEMPORARY_REFRESH_TTL_SECONDS=${DAEMON_TEMPORARY_REFRESH_TTL_SECONDS:-0}
      - DAEMON_MAIL_SENDER_MODE=${DAEMON_MAIL_SENDER_MODE:-console}
      - DAEMON_MAIL_FROM_ADDRESS=${DAEMON_MAIL_FROM_ADDRESS:-noreply@daemon.ai}
      - DAEMON_MAIL_SMTP_HOST=${DAEMON_MAIL_SMTP_HOST:-}
      - DAEMON_MAIL_SMTP_PORT=${DAEMON_MAIL_SMTP_PORT:-587}
      - DAEMON_MAIL_SMTP_USERNAME=${DAEMON_MAIL_SMTP_USERNAME:-}
      - DAEMON_MAIL_SMTP_PASSWORD=${DAEMON_MAIL_SMTP_PASSWORD:-}
      - DAEMON_MAIL_SMTP_USE_TLS=${DAEMON_MAIL_SMTP_USE_TLS:-true}
      - DAEMON_TRUST_PROXY_FORWARDED_CLIENT_IP=${DAEMON_TRUST_PROXY_FORWARDED_CLIENT_IP:-false}
      - DAEMON_HOSTED_IDENTITY_REQUIRE_REDIS=${DAEMON_HOSTED_IDENTITY_REQUIRE_REDIS:-true}
    volumes:
      - .:/app
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - daemon-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - FAL_KEY=${FAL_KEY}
      - MOCK_LLM=${MOCK_LLM:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql://daemon:daemon@postgres:5432/daemon}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DAEMON_ENCRYPTION_KEY=${DAEMON_ENCRYPTION_KEY}
      - DAEMON_ENVIRONMENT=${DAEMON_ENVIRONMENT:-development}
      - DAEMON_AUTH_PEPPER=${DAEMON_AUTH_PEPPER}
      - DAEMON_ADMIN_API_KEY=${DAEMON_ADMIN_API_KEY}
      - DAEMON_HOSTED_IDENTITY_ENABLED=${DAEMON_HOSTED_IDENTITY_ENABLED:-false}
      - DAEMON_DEPLOYMENT_MODE=${DAEMON_DEPLOYMENT_MODE:-self_hosted}
      - DAEMON_SIGNUP_MODE=${DAEMON_SIGNUP_MODE:-invite_only}
      - DAEMON_GOOGLE_ENABLED=${DAEMON_GOOGLE_ENABLED:-true}
      - DAEMON_GOOGLE_CLIENT_ID=${DAEMON_GOOGLE_CLIENT_ID:-}
      - DAEMON_GOOGLE_AUDIENCE_ALLOWLIST=${DAEMON_GOOGLE_AUDIENCE_ALLOWLIST:-}
      - DAEMON_EMAIL_ENABLED=${DAEMON_EMAIL_ENABLED:-true}
      - DAEMON_EMAIL_CHALLENGE_TTL_SECONDS=${DAEMON_EMAIL_CHALLENGE_TTL_SECONDS:-600}
      - DAEMON_EMAIL_CHALLENGE_MAX_ATTEMPTS=${DAEMON_EMAIL_CHALLENGE_MAX_ATTEMPTS:-5}
      - DAEMON_GOOGLE_NONCE_TTL_SECONDS=${DAEMON_GOOGLE_NONCE_TTL_SECONDS:-600}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_HOUR=${DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_HOUR:-3}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_DAY=${DAEMON_RATE_LIMIT_EMAIL_START_PER_EMAIL_PER_DAY:-10}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_HOUR=${DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_HOUR:-5}
      - DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_DAY=${DAEMON_RATE_LIMIT_EMAIL_START_PER_IP_PER_DAY:-20}
      - DAEMON_RATE_LIMIT_EMAIL_COMPLETE_PER_IP_PER_HOUR=${DAEMON_RATE_LIMIT_EMAIL_COMPLETE_PER_IP_PER_HOUR:-20}
      - DAEMON_PRIVATE_REFRESH_TTL_DAYS=${DAEMON_PRIVATE_REFRESH_TTL_DAYS:-90}
      - DAEMON_TEMPORARY_REFRESH_TTL_SECONDS=${DAEMON_TEMPORARY_REFRESH_TTL_SECONDS:-0}
      - DAEMON_MAIL_SENDER_MODE=${DAEMON_MAIL_SENDER_MODE:-console}
      - DAEMON_MAIL_FROM_ADDRESS=${DAEMON_MAIL_FROM_ADDRESS:-noreply@daemon.ai}
      - DAEMON_MAIL_SMTP_HOST=${DAEMON_MAIL_SMTP_HOST:-}
      - DAEMON_MAIL_SMTP_PORT=${DAEMON_MAIL_SMTP_PORT:-587}
      - DAEMON_MAIL_SMTP_USERNAME=${DAEMON_MAIL_SMTP_USERNAME:-}
      - DAEMON_MAIL_SMTP_PASSWORD=${DAEMON_MAIL_SMTP_PASSWORD:-}
      - DAEMON_MAIL_SMTP_USE_TLS=${DAEMON_MAIL_SMTP_USE_TLS:-true}
      - DAEMON_TRUST_PROXY_FORWARDED_CLIENT_IP=${DAEMON_TRUST_PROXY_FORWARDED_CLIENT_IP:-false}
      - DAEMON_HOSTED_IDENTITY_REQUIRE_REDIS=${DAEMON_HOSTED_IDENTITY_REQUIRE_REDIS:-true}
    volumes:
      - .:/app
    command: python -m orchestrator.worker.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - daemon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
      # Pass them as ARGs so the Dockerfile's `npm run build` step sees them.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_DAEMON_DEPLOYMENT_MODE: ${NEXT_PUBLIC_DAEMON_DEPLOYMENT_MODE:-self-hosted}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_EMAIL_ENABLED: ${NEXT_PUBLIC_EMAIL_ENABLED:-true}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # NEXT_PUBLIC_* vars are baked at build time (see `build.args` above).
      # The runtime entries below are kept for parity but only NEXT_PUBLIC_API_URL
      # is meaningful at runtime in this image; the others are baked at build.
      # Default is self-hosted (setup-first landing); set "hosted" to switch
      # the landing to Google / email sign-in. See .env.example.
      - NEXT_PUBLIC_DAEMON_DEPLOYMENT_MODE=${NEXT_PUBLIC_DAEMON_DEPLOYMENT_MODE:-self-hosted}
      # Public Google OAuth web client ID; required for the Google
      # sign-in button on the hosted landing. Leave empty for self-hosted.
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      # Public hosted-email availability flag. Pair with backend
      # DAEMON_EMAIL_ENABLED so hosted UI does not render the email form when
      # the provider is disabled.
      - NEXT_PUBLIC_EMAIL_ENABLED=${NEXT_PUBLIC_EMAIL_ENABLED:-true}
    command: npm run start
    depends_on:
      - backend
    networks:
      - daemon-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-daemon}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-daemon}
      - POSTGRES_DB=${POSTGRES_DB:-daemon}
    volumes:
      - daemon_postgres16_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daemon}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - daemon-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - daemon-network

  # Crawl4AI - Internal web scraping service for fetch strategies
  # Could be shared with future @browser subagent for screenshot capabilities
  crawl4ai:
    image: unclecode/crawl4ai:latest
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - daemon-network

networks:
  daemon-network:
    driver: bridge

volumes:
  daemon_postgres16_data:
  redis_data:
