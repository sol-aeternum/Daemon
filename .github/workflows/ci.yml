name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # pyrightconfig.json points basedpyright at .uv-venv (the audit-mandated
      # project environment). uv must create/use the same directory in CI or
      # basedpyright exits 3 with "venv .uv-venv subdirectory not found".
      UV_PROJECT_ENVIRONMENT: .uv-venv
    services:
      # Disposable database for the durable-task race and fencing tests
      # (docs/DURABLE_REQUEST_DESIGN.md §12 decision 10). Only
      # TASKS_TEST_DATABASE_URL points here; other database-gated suites keep
      # skipping until they are enabled deliberately.
      tasks-postgres:
        image: pgvector/pgvector@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337 # pg16
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks-ci-only
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          resolution-strategy: lowest
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync backend dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Basedpyright error gate
        run: uv run basedpyright --level error

      - name: Bandit high-severity gate
        run: uv run bandit -r orchestrator providers scripts tests -lll

      - name: Bandit full inventory
        continue-on-error: true
        run: uv run bandit -r orchestrator providers scripts tests

      - name: Python dependency audit
        run: uv run pip-audit

      - name: Pytest
        # The runner's 20-minute suite deadline leaves room for artifact upload;
        # this step and the job retain separate fallback cancellation bounds.
        timeout-minutes: 25
        env:
          # Dump pending asyncio tasks before the 120s faulthandler watchdog (#454).
          DAEMON_PYTEST_ASYNCIO_DUMP_S: "90"
          TASKS_TEST_DATABASE_URL: postgresql://tasks:tasks-ci-only@127.0.0.1:5432/tasks_test
        run: bash scripts/run_backend_pytest.sh

      - name: Upload backend pytest diagnostics
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-pytest-diagnostics
          path: |
            pytest-diagnostics/pytest.log
            pytest-diagnostics/pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Vendored braces integrity and security regressions
        run: npm run security:braces

      - name: Type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Frontend dependency audit
        run: npm run audit:ci

      - name: Vitest
        run: npm run test:run

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Browser regression inventory
        continue-on-error: true
        run: npm run test:browser

      - name: Upload browser regression screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-regressions
          path: frontend/test-results/
          retention-days: 7

      - name: Build
        run: npm run build

  feature-matrix:
    name: Feature matrix gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate feature matrix
        run: python scripts/lint_feature_matrix.py

  pre-commit-security:
    name: Pre-commit and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          resolution-strategy: lowest
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync backend dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run commit message hook
        run: |
          printf 'ci: validate commit message hook\n' > /tmp/commit-message
          uv run pre-commit run commitlint --hook-stage commit-msg --commit-msg-filename /tmp/commit-message
