name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    env:
      # pyrightconfig.json points basedpyright at .uv-venv (the audit-mandated
      # project environment). uv must create/use the same directory in CI or
      # basedpyright exits 3 with "venv .uv-venv subdirectory not found".
      UV_PROJECT_ENVIRONMENT: .uv-venv
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync backend dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Basedpyright error gate
        run: uv run basedpyright --level error

      - name: Bandit SAST inventory
        continue-on-error: true
        run: uv run bandit -r orchestrator providers scripts tests

      - name: Python dependency audit inventory
        continue-on-error: true
        run: uv run pip-audit

      - name: Pytest inventory
        continue-on-error: true
        run: PYTHONPATH=. uv run pytest -q

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check inventory
        continue-on-error: true
        run: npm run type-check

      - name: ESLint inventory
        continue-on-error: true
        run: npm run lint

      - name: Prettier check inventory
        continue-on-error: true
        run: npm run format:check

      - name: Frontend dependency audit inventory
        continue-on-error: true
        run: npm run audit:ci

      - name: Vitest inventory
        continue-on-error: true
        run: npm run test:run

      - name: Build inventory
        continue-on-error: true
        run: npm run build

  feature-matrix:
    name: Feature matrix gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate feature matrix
        run: python scripts/lint_feature_matrix.py

  pre-commit-security:
    name: Pre-commit and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync backend dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run commit message hook
        run: |
          printf 'ci: validate commit message hook\n' > /tmp/commit-message
          uv run pre-commit run commitlint --hook-stage commit-msg --commit-msg-filename /tmp/commit-message
