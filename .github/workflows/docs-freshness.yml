name: Documentation Freshness

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - '*.md'
      - docker-compose.yml
      - orchestrator/config.py
      - orchestrator/routes/**
      - orchestrator/tools/**
      - orchestrator/subagents/**
      - orchestrator/prompts.py
      - orchestrator/council/**
      - orchestrator/commands/council.py
      - orchestrator/services/fetch/**
      - orchestrator/main.py
      - orchestrator/daemon.py
      - orchestrator/router.py
      - orchestrator/memory/**
      - migrations/**
      - scripts/check_doc_freshness.py
      - .github/workflows/docs-freshness.yml
      - .pre-commit-config.yaml
      - .env.example
      - providers/**
      - frontend/**
      - tests/benchmark_results/doc-alignment-regeneration/truth_set.md
  pull_request:
    paths:
      - docs/**
      - '*.md'
      - docker-compose.yml
      - orchestrator/config.py
      - orchestrator/routes/**
      - orchestrator/tools/**
      - orchestrator/subagents/**
      - orchestrator/prompts.py
      - orchestrator/council/**
      - orchestrator/commands/council.py
      - orchestrator/services/fetch/**
      - orchestrator/main.py
      - orchestrator/daemon.py
      - orchestrator/router.py
      - orchestrator/memory/**
      - migrations/**
      - scripts/check_doc_freshness.py
      - .github/workflows/docs-freshness.yml
      - .pre-commit-config.yaml
      - .env.example
      - providers/**
      - frontend/**
      - tests/benchmark_results/doc-alignment-regeneration/truth_set.md

jobs:
  doc-freshness:
    name: Check doc freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/.python-version'
      - run: uv run python scripts/check_doc_freshness.py --mode fail
