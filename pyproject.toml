[project]
name = "daemon"
version = "0.1.0"
description = "Daemon AI orchestration system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.5",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "litellm>=1.81.1",
    "openai>=1.10.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.40.0",
    "asyncpg>=0.30.0",
    "arq>=0.26.1",
    "python-docx>=1.1.0",
    "trafilatura>=1.12.0",
    "youtube-transcript-api>=1.2.0",
    "fal-client>=0.10.0",
    "google-auth>=2.53.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]
exclude = ["backend", "frontend", "data", "tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "basedpyright>=1.39.6",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py311"
line-length = 100
include = [
    "orchestrator/**/*.py",
    "providers/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
]
extend-exclude = ["tests/test_video_e2e.py"]

[tool.ruff.lint]
extend-select = ["RUF100"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
baselineFile = ".basedpyright/baseline.json"
